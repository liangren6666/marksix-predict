name: daily

on:
  schedule:
    # 北京时间 22:40 和次日 08:20，各抓一次当天开奖
    - cron: "40 14 * * *"
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prediction dependencies
        run: pip install beautifulsoup4 pandas numpy "scikit-learn==1.8.0"
      - name: Fetch new draws
        id: update
        run: python scripts/update_newam6hc.py
      - name: Train forecast models
        if: steps.update.outputs.changed == 'true'
        run: python -m ml.run_train --save-fit all
      - name: Rebuild date forecasts
        if: steps.update.outputs.changed == 'true'
        run: python -m ml.export_forecasts
      - name: Commit updated data
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/newam6hc_5y_verified.csv data/newam6hc_5y.csv data/forecasts.json data/train_report.json models/hgb_special.pkl models/logreg_special.pkl
          git commit -m "Update draws, retrain models, and rebuild forecasts."
          git push
      - uses: actions/setup-node@v4
        if: steps.update.outputs.changed == 'true'
        with:
          node-version: 22
      - name: Build site
        if: steps.update.outputs.changed == 'true'
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        if: steps.update.outputs.changed == 'true'
        with:
          path: web/dist

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
